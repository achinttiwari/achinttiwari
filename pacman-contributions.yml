name: generate arcade contribution graphs

on:
  schedule:
    - cron: "0 0 * * *"   # runs automatically every 24 hours
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: achinttiwari
          # comma-separated list of game names to generate
          games: 'pacman'

      # this step is the one that was missing — without it the SVG
      # gets generated but never actually gets pushed anywhere
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
