<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 400" width="800" height="400">

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="100%" stop-color="#0d0221"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- terminal card -->
  <rect x="4" y="4" width="792" height="392" rx="16" fill="url(#bg-grad)" stroke="#7c3aed" stroke-width="1.5" filter="url(#glow)"/>

  <!-- header bar -->
  <rect x="4" y="4" width="792" height="44" rx="16" fill="#1a0033"/>
  <circle cx="30" cy="26" r="6" fill="#f87171"/>
  <circle cx="52" cy="26" r="6" fill="#fbbf24"/>
  <circle cx="74" cy="26" r="6" fill="#34d399"/>
  <text x="400" y="31" font-family="Consolas, Menlo, monospace" font-size="13" fill="#c4b5fd" text-anchor="middle">roadmap.py — zsh</text>

  <!-- ===== line 1 ===== -->
  <path id="p1">
    <animate id="a1" attributeName="d" begin="0.3s" dur="900ms" fill="freeze"
      values="M30,85 h0;M30,85 h205" keyTimes="0;1"/>
  </path>
  <text x="30" y="90" font-family="Consolas, Menlo, monospace" font-size="17" fill="#f472b6">
    <textPath xlink:href="#p1">$ python roadmap.py</textPath>
  </text>

  <!-- ===== line 2 ===== -->
  <path id="p2">
    <animate id="a2" attributeName="d" begin="a1.end+0.15s" dur="1755ms" fill="freeze"
      values="M30,123 h0;M30,123 h386" keyTimes="0;1"/>
  </path>
  <text x="30" y="128" font-family="Consolas, Menlo, monospace" font-size="17" fill="#fbbf24">
    <textPath xlink:href="#p2">[~] Stage 1: Foundations (IN PROGRESS)</textPath>
  </text>

  <!-- ===== line 3 ===== -->
  <path id="p3">
    <animate id="a3" attributeName="d" begin="a2.end+0.15s" dur="1350ms" fill="freeze"
      values="M30,161 h0;M30,161 h300" keyTimes="0;1"/>
  </path>
  <text x="30" y="166" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a78bfa">
    <textPath xlink:href="#p3">[ ] Stage 2: Data &amp; Math Core</textPath>
  </text>

  <!-- ===== line 4 ===== -->
  <path id="p4">
    <animate id="a4" attributeName="d" begin="a3.end+0.15s" dur="1800ms" fill="freeze"
      values="M30,199 h0;M30,199 h395" keyTimes="0;1"/>
  </path>
  <text x="30" y="204" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a78bfa">
    <textPath xlink:href="#p4">[ ] Stage 3: Classical Machine Learning</textPath>
  </text>

  <!-- ===== line 5 ===== -->
  <path id="p5">
    <animate id="a5" attributeName="d" begin="a4.end+0.15s" dur="1215ms" fill="freeze"
      values="M30,237 h0;M30,237 h272" keyTimes="0;1"/>
  </path>
  <text x="30" y="242" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a78bfa">
    <textPath xlink:href="#p5">[ ] Stage 4: Deep Learning</textPath>
  </text>

  <!-- ===== line 6 ===== -->
  <path id="p6">
    <animate id="a6" attributeName="d" begin="a5.end+0.15s" dur="1665ms" fill="freeze"
      values="M30,275 h0;M30,275 h366" keyTimes="0;1"/>
  </path>
  <text x="30" y="280" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a78bfa">
    <textPath xlink:href="#p6">[ ] Stage 5: Applied AI &amp; Automation</textPath>
  </text>

  <!-- ===== line 7 ===== -->
  <path id="p7">
    <animate id="a7" attributeName="d" begin="a6.end+0.15s" dur="1710ms" fill="freeze"
      values="M30,313 h0;M30,313 h376" keyTimes="0;1"/>
  </path>
  <text x="30" y="318" font-family="Consolas, Menlo, monospace" font-size="17" fill="#a78bfa">
    <textPath xlink:href="#p7">[ ] Stage 6: Engineering &amp; Deployment</textPath>
  </text>

  <!-- blinking cursor after typing completes -->
  <rect x="410" y="304" width="10" height="18" fill="#ec4899" opacity="0">
    <animate attributeName="opacity" begin="a7.end+0.2s" dur="1s" values="1;0;1" keyTimes="0;0.5;1" repeatCount="indefinite"/>
  </rect>

</svg>
