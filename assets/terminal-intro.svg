<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Courier New', monospace">

  <!-- window -->
  <rect x="1" y="1" width="758" height="298" rx="14" fill="#0D1117" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="758" height="38" rx="14" fill="#11161d"/>
  <rect x="1" y="25" width="758" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#10B981" fill-opacity="1"/>
  <circle cx="46" cy="20" r="6" fill="#10B981" fill-opacity="0.6"/>
  <circle cx="66" cy="20" r="6" fill="#10B981" fill-opacity="0.3"/>
  <text x="380" y="25" text-anchor="middle" fill="#8b949e" font-size="13">achint@ai-engineer: ~</text>

  <!-- clip paths for typing reveal -->
  <defs>
    <clipPath id="clip1"><rect x="0" y="0" height="26" width="0"><animate attributeName="width" from="0" to="330" dur="0.9s" begin="0.3s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip2"><rect x="0" y="0" height="26" width="0"><animate attributeName="width" from="0" to="220" dur="0.5s" begin="1.5s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip3"><rect x="0" y="0" height="26" width="0"><animate attributeName="width" from="0" to="430" dur="1.1s" begin="2.6s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip4"><rect x="0" y="0" height="26" width="0"><animate attributeName="width" from="0" to="610" dur="1.4s" begin="4.1s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip5"><rect x="0" y="0" height="26" width="0"><animate attributeName="width" from="0" to="300" dur="0.9s" begin="6.0s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip6"><rect x="0" y="0" height="26" width="0"><animate attributeName="width" from="0" to="640" dur="1.5s" begin="7.3s" fill="freeze" calcMode="linear"/></rect></clipPath>
  </defs>

  <!-- line 1 : whoami -->
  <g transform="translate(28,72)" clip-path="url(#clip1)">
    <text font-size="18"><tspan fill="#10B981">achint@kali</tspan><tspan fill="#6e7681">:~$ </tspan><tspan fill="#E6EDF3">whoami</tspan></text>
  </g>

  <!-- line 2 : output -->
  <g transform="translate(28,107)" clip-path="url(#clip2)">
    <text font-size="18" fill="#8b949e">&gt; Achint Tiwari</text>
  </g>

  <!-- line 3 : cat mission -->
  <g transform="translate(28,147)" clip-path="url(#clip3)">
    <text font-size="18"><tspan fill="#10B981">achint@kali</tspan><tspan fill="#6e7681">:~$ </tspan><tspan fill="#E6EDF3">cat mission.txt</tspan></text>
  </g>

  <!-- line 4 : mission output -->
  <g transform="translate(28,182)" clip-path="url(#clip4)">
    <text font-size="18" fill="#8b949e">&gt; Learning by building. Becoming an AI Engineer.</text>
  </g>

  <!-- line 5 : status --live -->
  <g transform="translate(28,222)" clip-path="url(#clip5)">
    <text font-size="18"><tspan fill="#10B981">achint@kali</tspan><tspan fill="#6e7681">:~$ </tspan><tspan fill="#E6EDF3">status --live</tspan></text>
  </g>

  <!-- line 6 : final status -->
  <g transform="translate(28,257)" clip-path="url(#clip6)">
    <text font-size="18" fill="#10B981">&gt; [ACTIVE] Python + ML Libraries | Cybersecurity Undergrad</text>
  </g>

  <!-- blinking cursor -->
  <rect x="28" y="240" width="10" height="20" fill="#10B981" opacity="0">
    <animate attributeName="x" from="28" to="28" dur="0.1s" begin="8.8s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.799;0.8;0.9;0.901;1" dur="1s" begin="8.8s" repeatCount="indefinite"/>
  </rect>

</svg>
