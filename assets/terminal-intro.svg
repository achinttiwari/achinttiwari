<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" font-weight="700">

  <!-- window -->
  <rect x="1" y="1" width="758" height="398" rx="14" fill="#0D1117" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="758" height="38" rx="14" fill="#161b22"/>
  <rect x="1" y="25" width="758" height="14" fill="#161b22"/>
  <circle cx="26" cy="20" r="6" fill="#10B981" fill-opacity="1"/>
  <circle cx="46" cy="20" r="6" fill="#10B981" fill-opacity="0.6"/>
  <circle cx="66" cy="20" r="6" fill="#10B981" fill-opacity="0.3"/>
  <text x="380" y="25" text-anchor="middle" fill="#c9d1d9" font-size="14">achint@ai-engineer: ~</text>

  <!-- all text is fully static, bold, and high-contrast -->

  <text x="28" y="74" font-size="19">
    <tspan fill="#3FE0A5">achint@kali</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#FFFFFF">whoami</tspan>
  </text>
  <text x="28" y="104" font-size="19" fill="#E6EDF3">&gt; Achint Tiwari — B.Tech CSE, Cybersecurity (3rd year)</text>

  <text x="28" y="144" font-size="19">
    <tspan fill="#3FE0A5">achint@kali</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#FFFFFF">cat about.md</tspan>
  </text>
  <text x="28" y="174" font-size="19" fill="#E6EDF3">&gt; Self-taught in AI &amp; Machine Learning. I don't learn</text>
  <text x="28" y="200" font-size="19" fill="#E6EDF3">&gt; well from theory alone — I learn by building things</text>
  <text x="28" y="226" font-size="19" fill="#E6EDF3">&gt; and breaking them until I understand why.</text>
  <text x="28" y="252" font-size="19" fill="#E6EDF3">&gt; I also vibe-code: moving fast, chasing curiosity.</text>
  <text x="28" y="278" font-size="19" fill="#E6EDF3">&gt; Drawn to work that's both functional and beautiful.</text>

  <text x="28" y="318" font-size="19">
    <tspan fill="#3FE0A5">achint@kali</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#FFFFFF">echo $GOAL</tspan>
  </text>
  <text x="28" y="348" font-size="19" fill="#3FE0A5">&gt; Becoming an AI Engineer. One commit at a time.</text>

  <text x="28" y="378" font-size="19">
    <tspan fill="#3FE0A5">achint@kali</tspan><tspan fill="#8b949e">:~$</tspan>
  </text>

  <!-- blinking cursor, simple and reliable -->
  <rect x="128" y="363" width="11" height="21" fill="#3FE0A5">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>

</svg>
