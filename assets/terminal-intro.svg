<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Courier New', monospace">

  <!-- window -->
  <rect x="1" y="1" width="758" height="398" rx="14" fill="#0D1117" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="758" height="38" rx="14" fill="#11161d"/>
  <rect x="1" y="25" width="758" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#10B981" fill-opacity="1"/>
  <circle cx="46" cy="20" r="6" fill="#10B981" fill-opacity="0.6"/>
  <circle cx="66" cy="20" r="6" fill="#10B981" fill-opacity="0.3"/>
  <text x="380" y="25" text-anchor="middle" fill="#8b949e" font-size="13">achint@ai-engineer: ~</text>

  <!-- all text is fully static and always visible -->

  <text x="28" y="72" font-size="17">
    <tspan fill="#10B981">achint@kali</tspan><tspan fill="#6e7681">:~$ </tspan><tspan fill="#E6EDF3">whoami</tspan>
  </text>
  <text x="28" y="100" font-size="17" fill="#8b949e">&gt; Achint Tiwari — B.Tech CSE, Cybersecurity (3rd year)</text>

  <text x="28" y="138" font-size="17">
    <tspan fill="#10B981">achint@kali</tspan><tspan fill="#6e7681">:~$ </tspan><tspan fill="#E6EDF3">cat about.md</tspan>
  </text>
  <text x="28" y="166" font-size="17" fill="#8b949e">&gt; Self-taught in AI &amp; Machine Learning. I don't learn well</text>
  <text x="28" y="190" font-size="17" fill="#8b949e">&gt; from theory alone — I learn by building things and</text>
  <text x="28" y="214" font-size="17" fill="#8b949e">&gt; breaking them until I understand why they broke.</text>
  <text x="28" y="238" font-size="17" fill="#8b949e">&gt; I also vibe-code: moving fast, chasing curiosity.</text>
  <text x="28" y="262" font-size="17" fill="#8b949e">&gt; Drawn to work that's both functional and beautiful.</text>

  <text x="28" y="300" font-size="17">
    <tspan fill="#10B981">achint@kali</tspan><tspan fill="#6e7681">:~$ </tspan><tspan fill="#E6EDF3">echo $GOAL</tspan>
  </text>
  <text x="28" y="328" font-size="17" fill="#10B981">&gt; Becoming an AI Engineer. One commit at a time.</text>

  <text x="28" y="360" font-size="17">
    <tspan fill="#10B981">achint@kali</tspan><tspan fill="#6e7681">:~$ </tspan><tspan id="cursor-text" fill="#E6EDF3"> </tspan>
  </text>

  <!-- blinking cursor, simple and reliable -->
  <rect x="132" y="345" width="10" height="20" fill="#10B981">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>

</svg>
